AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Communication Assessment Backend API

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - arm64
    Environment:
      Variables:
        DYNAMODB_TABLE: communication_questions
        INTERVIEW_TABLE: interview_sessions

  Api:
    BinaryMediaTypes:
      - "audio/mpeg"
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      # Browsers do not let "*" cover Authorization, so list the headers we send.
      AllowHeaders: "'Authorization,Content-Type,Accept'"
      AllowOrigin: "'*'"

Parameters:
  OpenAiApiKey:
    Type: String
    Description: OpenAI API Key
    NoEcho: true
  ClerkSecretKey:
    Type: String
    Description: Optional. Lets the API also accept Clerk publicMetadata.isPremium. Tokens are verified without it.
    NoEcho: true
    Default: ""
  SupabaseServiceRoleKey:
    Type: String
    Description: Optional. Used instead of the public anon key for the Premium lookup.
    NoEcho: true
    Default: ""

Resources:
  CommunicationAPI:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: communication-assessment-api
      CodeUri: backend/
      Handler: main.handler
      Description: FastAPI backend for Communication Assessment
      Environment:
        Variables:
          DYNAMODB_TABLE: communication_questions
          BEDROCK_REGION: !Ref AWS::Region
          OPENAI_API_KEY: !Ref OpenAiApiKey
          INTERVIEW_TABLE: interview_sessions
          RESUME_BUCKET_NAME: !Ref ResumeBucket
          ALLOWED_ORIGINS: "https://www.harrytheblaze.site,https://harrytheblaze.site,http://localhost:5173,http://localhost:3000,http://localhost:8080"
          # Session tokens are verified against Clerk's public key set for this issuer.
          CLERK_ISSUER: "https://clerk.harrytheblaze.site"
          CLERK_AUTHORIZED_PARTIES: "https://www.harrytheblaze.site,https://harrytheblaze.site,http://localhost:5173,http://localhost:8080"
          # Premium lookup. The anon key is public (the website ships it), not a secret.
          SUPABASE_URL: "https://ixgusnrurhurhpezhzem.supabase.co"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4Z3VzbnJ1cmh1cmhwZXpoemVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzMzU0NzcsImV4cCI6MjA4MTkxMTQ3N30.lptnjFiBzXKj8LTBoKjRDCXDllUJyIRxPjq5FxxdxLY"
          CLERK_SECRET_KEY: !Ref ClerkSecretKey
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: communication_questions
        - DynamoDBCrudPolicy:
            TableName: interview_sessions
        - Statement:
          - Effect: Allow
            Action:
              - bedrock:*
              - aws-marketplace:*
              - polly:*
            Resource: '*'
        - S3CrudPolicy:
            BucketName: !Ref ResumeBucket
        - S3ReadPolicy:
            BucketName: !Ref AudioAssetsBucket
      Events:
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY


  CommunicationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: communication_questions
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: section
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SectionIndex
          KeySchema:
            - AttributeName: section
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  InterviewSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: interview_sessions
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  ResumeBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, POST, GET]
            AllowedOrigins: ["*"]
            MaxAge: 3000

  AudioAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET]
            AllowedOrigins: ["*"]

  AudioAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AudioAssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${AudioAssetsBucket.Arn}/*"

Outputs:
  CommunicationApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  
  CommunicationApiFunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt CommunicationAPI.Arn

  ResumeBucketName:
    Description: "Name of the S3 bucket for resumes"
    Value: !Ref ResumeBucket

  AudioAssetsBucketName:
    Description: "S3 Bucket for Audio Assets"
    Value: !Ref AudioAssetsBucket
